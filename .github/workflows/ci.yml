name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so env validation passes; no job connects to a database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret
      APP_URL: http://localhost:3000
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version-file: package.json

      - name: Locate Bun dependency cache
        id: bun-cache
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - run: bun install --frozen-lockfile

      - name: Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Migrations match schema
        run: |
          bun run db:generate
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"

      - name: Test
        run: bun run test
