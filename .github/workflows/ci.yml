name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so env validation passes; no job connects to a database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Migrations match schema
        run: |
          bun run db:generate
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"

      - name: Test
        run: bun run test
