name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so env validation passes; no job connects to a database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret
      APP_URL: http://localhost:3000
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version-file: package.json

      - name: Locate Bun dependency cache
        id: bun-cache
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - run: bun install --frozen-lockfile

      - name: Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Migrations match schema
        run: |
          bun run db:generate
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"

      - name: Test
        run: bun run test

      # Cache Components reports some errors only at build time (ADR 0006).
      - name: Build
        run: bun run build

      - name: Dependency audit
        run: bun audit --audit-level=high

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway database and fake vendors: no secrets, so fork PRs run it too.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-secret
          APP_URL: http://localhost:3100
          RESEND_API_KEY: ci-resend-key
          EMAIL_FROM: ci@example.com

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Builds the app, starts it with the fake Graph API, seeds and runs.
      - name: Browser tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  postgres:
    name: Real Postgres Bot turns
    runs-on: ubuntu-latest
    # Fork PRs cannot access repository secrets. Never run untrusted fork code
    # through pull_request_target to work around that restriction.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Require Neon test project configuration
        run: |
          test -n "$NEON_API_KEY" || { echo 'Configure the NEON_API_KEY repository secret.'; exit 1; }
          test -n "$NEON_PROJECT_ID" || { echo 'Configure the NEON_PROJECT_ID repository variable.'; exit 1; }
      - name: Set branch expiry
        id: expiry
        run: echo "at=$(date -u -d '+1 hour' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/create-branch-action@v6
        id: branch
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: bot-turns-${{ github.run_id }}-${{ github.run_attempt }}
          branch_type: schema-only
          expires_at: ${{ steps.expiry.outputs.at }}
      - name: Test competing turns and expired leases
        run: bun run test:postgres
        env:
          BOT_TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
      - name: Delete ephemeral Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch_id }}

  # Applies pending migrations to production before Vercel promotes the new
  # deployment. Vercel Deployment Checks require this job, so a failed
  # migration leaves the previous deployment serving (ADR 0009).
  migrate:
    name: Migrate production
    needs: [check, e2e, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-database
    # Never run two migrations at once, and never cancel one halfway.
    concurrency:
      group: production-migrations
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
      # Placeholders so env validation passes; drizzle-kit reads only DATABASE_URL.
      BETTER_AUTH_SECRET: ci-secret
      APP_URL: http://localhost:3000
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Require the production connection string
        run: |
          test -n "$DATABASE_URL" || { echo 'Configure the PRODUCTION_DATABASE_DIRECT_URL secret on the production-database environment.'; exit 1; }
      - name: Apply migrations
        run: bun run db:migrate
